server.port=8080
spring.application.name=ms-admin-api-gateway

# JWT
jwt.secret=claveSuperSecretaParaJWT2024MicroserviciosGestionAcademicaChavez
jwt.expiration=86400000

# Base de Datos
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/bd_gateway
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# RUTAS DEL GATEWAY
# --- Ruta: Instructores ---
spring.cloud.gateway.routes[0].id=ms-gestion-instructor
spring.cloud.gateway.routes[0].uri=lb://ms-gestion-instructor
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/instructores/**

# Filtro: Circuit Breaker con fallback
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=instructorCB
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback

# Filtro: Retry (3 intentos, 1s de espera, 2x backoff)
spring.cloud.gateway.routes[0].filters[1].name=Retry
spring.cloud.gateway.routes[0].filters[1].args.retries=3
spring.cloud.gateway.routes[0].filters[1].args.statuses=BAD_GATEWAY,SERVICE_UNAVAILABLE
spring.cloud.gateway.routes[0].filters[1].args.methods=GET,POST,PUT,DELETE

# Filtro: Strip /api prefix
spring.cloud.gateway.routes[0].filters[2]=StripPrefix=1
spring.cloud.gateway.routes[0].filters[3].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[3].args.rate-limiter=gatewayLimiter

# --- Ruta: Alumnos ---
spring.cloud.gateway.routes[1].id=ms-gestion-alumno
spring.cloud.gateway.routes[1].uri=lb://ms-gestion-alumno
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/alumnos/**

spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=alumnoCB
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback

spring.cloud.gateway.routes[1].filters[1].name=Retry
spring.cloud.gateway.routes[1].filters[1].args.retries=3
spring.cloud.gateway.routes[1].filters[1].args.statuses=BAD_GATEWAY,SERVICE_UNAVAILABLE
spring.cloud.gateway.routes[1].filters[1].args.methods=GET,POST,PUT,DELETE

spring.cloud.gateway.routes[1].filters[2]=StripPrefix=1
spring.cloud.gateway.routes[1].filters[3].name=RequestRateLimiter
spring.cloud.gateway.routes[1].filters[3].args.rate-limiter=gatewayLimiter

# --- Ruta: Talleres ---
spring.cloud.gateway.routes[2].id=ms-gestion-taller
spring.cloud.gateway.routes[2].uri=lb://ms-gestion-taller
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/talleres/**

spring.cloud.gateway.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[2].filters[0].args.name=tallerCB
spring.cloud.gateway.routes[2].filters[0].args.fallbackUri=forward:/fallback

spring.cloud.gateway.routes[2].filters[1].name=Retry
spring.cloud.gateway.routes[2].filters[1].args.retries=3
spring.cloud.gateway.routes[2].filters[1].args.statuses=BAD_GATEWAY,SERVICE_UNAVAILABLE
spring.cloud.gateway.routes[2].filters[1].args.methods=GET,POST,PUT,DELETE

spring.cloud.gateway.routes[2].filters[2]=StripPrefix=1
spring.cloud.gateway.routes[2].filters[3].name=RequestRateLimiter
spring.cloud.gateway.routes[2].filters[3].args.rate-limiter=gatewayLimiter

# RATE LIMITER (Resilience4j)
resilience4j.ratelimiter.instances.gatewayLimiter.limitForPeriod=100
resilience4j.ratelimiter.instances.gatewayLimiter.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.gatewayLimiter.timeoutDuration=500ms

# CIRCUIT BREAKER (Gateway)
resilience4j.circuitbreaker.instances.instructorCB.slidingWindowSize=5
resilience4j.circuitbreaker.instances.instructorCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.instructorCB.waitDurationInOpenState=30s

resilience4j.circuitbreaker.instances.alumnoCB.slidingWindowSize=5
resilience4j.circuitbreaker.instances.alumnoCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.alumnoCB.waitDurationInOpenState=30s

resilience4j.circuitbreaker.instances.tallerCB.slidingWindowSize=5
resilience4j.circuitbreaker.instances.tallerCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.tallerCB.waitDurationInOpenState=30s
