server:
  port: 8888

spring:
  application:
    name: ms-admin-config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_LOCATION:file:../central-config/config-properties/}

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
    registerWithEureka: true
    fetchRegistry: true
